name: Package and Release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - README.md
      - cordis.patch.yml
      - lib/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate package version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          TAG="v$VERSION"
          PACKAGE_NAME="dsh-activity-tracker-$VERSION.tgz"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        if: steps.metadata.outputs.release_exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate source files
        if: steps.metadata.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check lib/index.js
          node --check lib/client.js
          npm pack --dry-run

      - name: Build and verify package
        if: steps.metadata.outputs.release_exists != 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          EXPECTED="${{ steps.metadata.outputs.package_name }}"
          if [[ "$TGZ" != "$EXPECTED" ]]; then
            echo "Unexpected package filename: $TGZ (expected $EXPECTED)" >&2
            exit 1
          fi

          tar -tzf "$TGZ" | sort > package-contents.txt
          printf '%s\n' \
            package/README.md \
            package/cordis.patch.yml \
            package/lib/client.js \
            package/lib/index.js \
            package/package.json | sort > expected-contents.txt
          diff -u expected-contents.txt package-contents.txt

          cp "$TGZ" dsh-activity-tracker.tgz
          sha256sum "$TGZ" > SHA256SUMS.txt
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: steps.metadata.outputs.release_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-activity-tracker-${{ steps.metadata.outputs.version }}
          path: |
            ${{ steps.package.outputs.tgz }}
            dsh-activity-tracker.tgz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.metadata.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.metadata.outputs.tag }}"
          TARGET_ARGS=(--target "$GITHUB_SHA")
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TARGET_ARGS=()
          fi

          gh release create "$TAG" \
            "${{ steps.package.outputs.tgz }}" \
            dsh-activity-tracker.tgz \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "dsh-activity-tracker ${{ steps.metadata.outputs.version }}" \
            --generate-notes \
            --latest \
            "${TARGET_ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
